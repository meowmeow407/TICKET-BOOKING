# ------------------ MONGODB DEPLOYMENT ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017

---
# ------------------ MONGODB SERVICE ------------------
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

---
# ------------------ APP DEPLOYMENT ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-app
spec:
  replicas: 2   # ✅ REQUIRED
  selector:
    matchLabels:
      app: ticket-app
  template:
    metadata:
      labels:
        app: ticket-app
    spec:
      containers:
      - name: ticket-app
        image: ticket-app
        imagePullPolicy: Never  # ⚠️ we will build this
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: mongodb://mongodb:27017/ticketDB

---
# ------------------ APP SERVICE ------------------
apiVersion: v1
kind: Service
metadata:
  name: ticket-app-service
spec:
  type: NodePort
  selector:
    app: ticket-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007